
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple and interactive To-Do List application">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>

    <main class="container">
        <header class="header">
            <h1>My To-Do List</h1>
            <p>Organize your day, one task at a time.</p>
        </header>

        <section class="task-section" aria-label="Task management">

            <form id="taskForm">
                <label for="taskInput">Add a new task</label>
                <div class="input-group">
                    <input
                        type="text"
                        id="taskInput"
                        placeholder="What needs to be done?"
                        maxlength="150"
                        required
                    >
                    <button type="submit" id="submitBtn">Add Task</button>
                </div>
            </form>

            <div class="task-info">
                <span id="taskCount">0 tasks remaining</span>
            </div>

            <nav class="filters" aria-label="Filter tasks">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </nav>

            <ul id="taskList" aria-label="Your tasks"></ul>

            <p id="emptyMessage" class="empty-message">
                No tasks yet. Add your first task!
            </p>

            <button id="clearCompleted" class="clear-btn">
                Clear Completed Tasks
            </button>

        </section>

        <footer>
            <p>Stay organized. Stay productive.</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
